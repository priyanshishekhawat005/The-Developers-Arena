<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <div class="bg-orb orb-1" aria-hidden="true"></div>
    <div class="bg-orb orb-2" aria-hidden="true"></div>

    <main id="main-content" class="app-shell">
      <header class="app-header">
        <div>
          <!-- <p class="eyebrow">Week 6 Project</p> -->
          <h1>Weather Dashboard</h1>
        </div>
        <p id="statusMessage" class="status" role="status" aria-live="polite">
          Ready.
        </p>
      </header>

      <section class="panel controls" aria-labelledby="controlsTitle">
        <h2 id="controlsTitle">Search & Preferences</h2>

        <form id="searchForm" class="search-row" autocomplete="off">
          <label for="cityInput" class="sr-only">Search city</label>
          <input
            id="cityInput"
            name="city"
            type="text"
            placeholder="Search city (e.g., Tokyo)"
            required
            aria-describedby="searchHint"
          />
          <button type="submit">Search</button>
        </form>

        <p id="searchHint" class="hint">Type at least 2 letters to get suggestions.</p>
        <ul id="searchSuggestions" class="suggestions" aria-label="City suggestions"></ul>

        <div class="control-grid">
          <div>
            <label for="unitsSelect">Units</label>
            <select id="unitsSelect">
              <option value="metric">Celsius (metric)</option>
              <option value="imperial">Fahrenheit (imperial)</option>
            </select>
          </div>

          <div>
            <label for="themeSelect">Theme</label>
            <select id="themeSelect">
              <option value="sunrise">Sunrise</option>
              <option value="coast">Coast</option>
              <option value="forest">Forest</option>
            </select>
          </div>
        </div>

        <div class="api-row">
          <label for="apiKeyInput">OpenWeatherMap API Key</label>
          <div class="api-input-wrap">
            <input id="apiKeyInput" type="password" placeholder="Paste your API key" />
            <button type="button" id="saveApiKeyBtn">Save Key</button>
          </div>
        </div>

        <div class="action-row">
          <button id="geoBtn" type="button">Use My Location</button>
          <button id="addFavoriteBtn" type="button" disabled>Add Current City to Favorites</button>
        </div>

        <div>
          <h3>Favorites</h3>
          <div id="favoritesList" class="favorites" aria-live="polite"></div>
        </div>
      </section>

      <section class="panel weather" aria-labelledby="weatherTitle">
        <h2 id="weatherTitle">Current Weather</h2>
        <article id="currentWeather" class="current-card" aria-live="polite">
          <p class="placeholder">Search for a city to see current weather.</p>
        </article>
      </section>

      <section class="panel forecast" aria-labelledby="forecastTitle">
        <h2 id="forecastTitle">5-Day Forecast</h2>
        <div id="forecastGrid" class="forecast-grid" aria-live="polite">
          <p class="placeholder">Forecast data will appear here.</p>
        </div>
      </section>
    </main>

    <div id="loadingOverlay" class="loading-overlay" hidden>
      <div class="spinner" aria-hidden="true"></div>
      <p>Loading weather data...</p>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
